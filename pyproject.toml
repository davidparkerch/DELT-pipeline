[project]
name = "delt_pipeline"
version = "0.1.0"
description = "Score DNA-encoded library (DEL) selections, validate the scores against measured affinities and publish FAIR hit tables."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "David Parker", email = "david.parker@bluewin.ch" }]
keywords = ["nextflow", "dna-encoded-library", "cheminformatics", "hit-identification", "fair"]
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1",
    "numpy>=2.3",
    "plotly>=7.1",
    "polars>=2.1",
    "rdkit>=2026.9.1",
    "scikit-learn>=1.9",
    "scipy>=1.18",
]

[project.urls]
Homepage = "https://github.com/davidparkerch/DELT-pipeline"
Repository = "https://github.com/davidparkerch/DELT-pipeline"

[project.scripts]
delt_pipeline = "delt_pipeline.cli:main"

[dependency-groups]
dev = [
    "frictionless[json]>=5.21",
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = [".nf-test", "work", "results"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "PT", "RUF", "D", "ANN", "N", "NPY", "PL", "C4", "PTH", "RET"]
ignore = [
    "D105",    # magic methods are self-explanatory
    "PLR0913", # CLI-shaped functions take many arguments
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "PLR2004", "S101"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = [
    "--strict-markers",
    "--cov=delt_pipeline",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=100",
]
filterwarnings = ["error"]

[tool.coverage.run]
source_pkgs = ["delt_pipeline"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
