# Publish the committed KinDEL report (docs/site/) on GitHub Pages, so reviewers can open the
# results without running anything. Refresh it with `just publish-report results`.
# The report is derived from KinDEL data: CC BY-NC-SA 4.0 (insitro terms), non-commercial.
name: Pages

on:
  push:
    branches: [main]
    paths: [docs/site/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/site
      - id: deployment
        uses: actions/deploy-pages@v4
